name: Volocal
options:
  bundleIdPrefix: com.fikrikarim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  llama-swift:
    url: https://github.com/mattt/llama.swift.git
    from: "2.0.0"
  FluidAudio:
    url: https://github.com/fikrikarim/FluidAudio.git
    branch: main

targets:
  Volocal:
    type: application
    platform: iOS
    sources:
      - path: Volocal
        excludes:
          # Fetched at build time and copied as folder references.
          - "Resources/LLM/**"
          - "Resources/Audio/**"
      - path: Volocal/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Volocal/Resources/LLM
        type: folder
        buildPhase: resources
      - path: Volocal/Resources/Audio
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch bundled LLM GGUF
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          /bin/bash "${SRCROOT}/scripts/fetch_llm_gguf.sh"
      - name: Fetch bundled speech models
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          /bin/bash "${SRCROOT}/scripts/fetch_audio_models.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fikrikarim.volocal
        INFOPLIST_FILE: Volocal/Info.plist
        CODE_SIGN_ENTITLEMENTS: Volocal/Volocal.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FBS8R927D4
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: llama-swift
        product: LlamaSwift
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Volocal/Info.plist
      properties:
        CFBundleName: Volocal
        CFBundleDisplayName: Volocal
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Volocal needs microphone access for voice conversations."
    entitlements:
      path: Volocal/Volocal.entitlements
      properties:
        com.apple.security.device.audio-input: true
